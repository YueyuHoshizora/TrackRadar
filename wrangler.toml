name = "track-radar"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 每 5 分鐘觸發一次
[triggers]
crons = ["*/5 * * * *"]

# 執行鎖：cron 與手動 /run 共用，避免多輪同時寫入 GitHub（見 src/lock.ts）
[[durable_objects.bindings]]
name = "RUN_LOCK"
class_name = "RunLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunLock"]

[vars]
# GitHub 儲存庫設定（不含機密資訊）
GITHUB_OWNER = "YueyuHoshizora"
GITHUB_REPO = "TrackRadar"
GITHUB_BRANCH = "main"
DATA_DIR = "data"
CHANNELS_FILE = "channels.json"
# 根目錄彙整檔：記錄各頻道目前最新影片，方便總覽
LATEST_INDEX_FILE = "latest-videos.json"
# Shorts 判定門檻（秒），<= 此秒數視為 Shorts
SHORT_MAX_SECONDS = "60"
# 每個頻道每次執行最多檢查幾支候選影片（由新到舊）以找出「目前最新一支」；找到第一支符合條件即停止
CANDIDATE_SCAN_LIMIT = "10"
# 備查用「全部影片 ID」清單，單一頻道最多列出幾支（避免超大頻道拖垮單次執行時間）
ALL_IDS_MAX_VIDEOS = "2000"

# 機密資訊請用以下指令設定，不要寫在這裡：
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put ADMIN_TOKEN   (手動觸發 /run 用的驗證 token，可選)
#   wrangler secret put TYPESAFE_API_KEY   (曲風分類用，呼叫 TypeSafe System One API 的 Jev，可選)
