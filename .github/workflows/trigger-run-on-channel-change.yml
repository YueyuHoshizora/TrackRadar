name: Trigger update on channel list change

# 當 channels.json 被修改並推送到 main 時（例如新增/移除追蹤頻道），
# 立刻呼叫已部署 Worker 的 /run 端點抓取一次，不必等下一次 cron（最多 5 分鐘）。
# 這裡只呼叫既有 Worker 的 HTTP API，不涉及 wrangler deploy，符合「手動部署」原則。
on:
  push:
    branches:
      - main
    paths:
      - "channels.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trigger-run-on-channel-change
  cancel-in-progress: false

jobs:
  trigger-run:
    # 忽略含 [skip ci] 的 commit（如 Worker 自動同步名稱/頭像產生的 commit），避免遞迴觸發
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Call TrackRadar /run endpoint
        run: |
          status=$(curl -s -o /tmp/run-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "https://track-radar.plain-leaf-e871.workers.dev/run")
          echo "HTTP status: $status"
          cat /tmp/run-response.json
          if [ "$status" -eq 409 ] || [ "$status" -eq 429 ]; then
            echo "::notice::Worker is already running or cooling down; the next cron run (within 5 minutes) will pick up the change."
            exit 0
          fi
          if [ "$status" -ne 200 ]; then
            echo "::error::/run returned HTTP $status"
            exit 1
          fi
